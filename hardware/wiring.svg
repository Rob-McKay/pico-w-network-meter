<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560"
     font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>Pico W network meter: wiring</title>
  <defs>
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4">
      <circle cx="4" cy="4" r="3.5" fill="#222"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" font-size="20" font-weight="bold">Pico W network meter: wiring</text>

  <!-- Battery -->
  <g>
    <rect x="40" y="330" width="170" height="110" rx="8" fill="#f2d6b3" stroke="#8a5a2b" stroke-width="2"/>
    <text x="125" y="368" text-anchor="middle" font-weight="bold">LiPo battery</text>
    <text x="125" y="390" text-anchor="middle">3.7 V 150 mAh</text>
    <text x="125" y="410" text-anchor="middle">JST-PH lead</text>
  </g>

  <!-- LiPo Amigo Pro -->
  <g>
    <rect x="290" y="300" width="230" height="170" rx="8" fill="#e3ecf7" stroke="#2b5a8a" stroke-width="2"/>
    <text x="405" y="328" text-anchor="middle" font-weight="bold">Pimoroni LiPo Amigo Pro</text>
    <text x="405" y="348" text-anchor="middle" font-size="12">charger, power switch</text>
    <rect x="290" y="372" width="70" height="28" fill="#fff" stroke="#2b5a8a"/>
    <text x="325" y="391" text-anchor="middle" font-size="12">BAT</text>
    <rect x="450" y="372" width="70" height="28" fill="#fff" stroke="#2b5a8a"/>
    <text x="485" y="391" text-anchor="middle" font-size="12">DEVICE</text>
    <rect x="370" y="440" width="70" height="30" fill="#ddd" stroke="#2b5a8a"/>
    <text x="405" y="460" text-anchor="middle" font-size="12">USB-C</text>
    <text x="405" y="420" text-anchor="middle" font-size="12">switch: ON/OFF</text>
  </g>

  <!-- Battery to BAT: the battery's own lead -->
  <path d="M210 375 H290" stroke="#d62728" stroke-width="4" fill="none"/>
  <path d="M210 395 H290" stroke="#222" stroke-width="4" fill="none"/>
  <text x="250" y="365" text-anchor="middle" font-size="12">plug in</text>

  <!-- USB-C charging input -->
  <path d="M405 470 V520" stroke="#888" stroke-width="6" fill="none"/>
  <text x="405" y="545" text-anchor="middle" font-size="12">USB-C: charge and power (5 V)</text>

  <!-- Pico W -->
  <g>
    <rect x="640" y="250" width="300" height="150" rx="6" fill="#dff0d8" stroke="#2b7a2b" stroke-width="2"/>
    <text x="760" y="280" text-anchor="middle" font-weight="bold">Raspberry Pi Pico W</text>
    <text x="760" y="298" text-anchor="middle" font-size="12">(seen from its top)</text>
    <rect x="640" y="330" width="18" height="40" fill="#ccc" stroke="#555"/>
    <text x="666" y="347" font-size="12">micro-USB (case open):</text>
    <text x="666" y="364" font-size="12">flash, console</text>
    <circle cx="905" cy="322" r="5" fill="#ffd400" stroke="#555"/>
    <text x="896" y="326" text-anchor="end" font-size="11">pin 40 VBUS: leave free</text>
    <circle cx="905" cy="346" r="6" fill="#d62728" stroke="#555"/>
    <text x="896" y="350" text-anchor="end" font-size="12" font-weight="bold">pin 39 VSYS</text>
    <circle cx="905" cy="370" r="6" fill="#222" stroke="#555"/>
    <text x="896" y="374" text-anchor="end" font-size="12" font-weight="bold">pin 38 GND</text>
  </g>

  <!-- DEVICE to Pico: + through a Schottky diode to VSYS, - to GND -->
  <path d="M520 380 H580 V140 H960 V346 H911" stroke="#d62728" stroke-width="4" fill="none"/>
  <path d="M520 392 H600 V160 H945 V370 H911" stroke="#222" stroke-width="4" fill="none"/>
  <!-- diode symbol on the red wire, anode left, cathode right -->
  <g transform="translate(760 140)">
    <rect x="-34" y="-20" width="68" height="40" fill="#fff"/>
    <path d="M-30 0 H-12" stroke="#d62728" stroke-width="4"/>
    <path d="M12 0 H30" stroke="#d62728" stroke-width="4"/>
    <polygon points="-12,-12 -12,12 10,0" fill="#222"/>
    <path d="M12 -13 V13" stroke="#222" stroke-width="4"/>
  </g>
  <text x="760" y="110" text-anchor="middle" font-size="13" font-weight="bold">Schottky diode 1N5817</text>
  <text x="760" y="127" text-anchor="middle" font-size="12">stripe (cathode) towards the Pico</text>
  <text x="572" y="230" text-anchor="end" font-size="12" fill="#d62728">red: +</text>
  <text x="608" y="230" font-size="12">black: &#8722;</text>
  <text x="560" y="414" text-anchor="middle" font-size="11">JST-PH lead</text>

  <!-- Display Pack -->
  <g>
    <rect x="640" y="440" width="300" height="80" rx="6" fill="#eee" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="790" y="470" text-anchor="middle" font-weight="bold">Pimoroni Pico Display Pack 2.0</text>
    <text x="790" y="492" text-anchor="middle" font-size="12">plugs onto the Pico's headers: no wires</text>
  </g>
  <path d="M790 390 V440" stroke="#555" stroke-width="2" stroke-dasharray="4 4" fill="none"/>

  <!-- Notes -->
  <g font-size="12">
    <text x="40" y="80" font-weight="bold">Notes</text>
    <text x="40" y="100">1. The diode stops 5 V from the Pico's own USB socket reaching the battery through the charger.</text>
    <text x="40" y="118">2. Solder the two wires to the tops of pins 39 and 38, where they come through the Pico.</text>
    <text x="40" y="136">3. Check the battery lead's polarity matches the charger's BAT marking before plugging it in.</text>
    <text x="40" y="154">4. The Amigo Pro's switch turns the meter on and off; the battery still charges when it is off.</text>
  </g>
</svg>
