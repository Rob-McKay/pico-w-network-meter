#
# The console on the Pico's own USB port, as a CDC-ACM serial port (with
# app/usb-console.overlay; scripts/build.sh adds both). On a Mac it appears
# as /dev/cu.usbmodem<N>; on Linux as /dev/ttyACM<N>.

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Raspberry Pi"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Pico W network meter"
# Raspberry Pi's vendor ID and the Pico SDK's USB serial product ID, as
# Pico firmware's USB serial ports use, instead of Zephyr's test IDs.
CONFIG_CDC_ACM_SERIAL_VID=0x2e8a
CONFIG_CDC_ACM_SERIAL_PID=0x000a

# Room for a scan's worth of log lines while the host catches up.
CONFIG_LOG_BUFFER_SIZE=4096
