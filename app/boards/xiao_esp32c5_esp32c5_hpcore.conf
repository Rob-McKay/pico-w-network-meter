# Seeed XIAO ESP32-C5: what only this board needs, on top of prj.conf.
# Zephyr adds this file for the board by name, as it does the overlay
# beside it (xiao_esp32c5_esp32c5_hpcore.overlay: the ILI9341 TFT, the
# buttons and the RGB LED). The board's devicetree enables the C5's Wi-Fi;
# its console is the C5's USB Serial/JTAG, on the USB-C socket.

# The image header's flash size: the module has 8 MB, as the devicetree
# and the flash runner say, but Espressif's Kconfig defaults to 2 MB.
CONFIG_ESPTOOLPY_FLASHSIZE_8MB=y

# Regulatory domain: which channels the chip scans (2.4 GHz 1-13 and the
# 5 GHz channels allowed in the UK). An ISO 3166-1 alpha-2 code;
# scripts/build.sh sets it from WIFI_COUNTRY.
CONFIG_METER_WIFI_COUNTRY="GB"

# Listen 130 ms on each channel, not the Wi-Fi library's 360 ms: beacons
# come every 102.4 ms, so every AP is still heard, and a sweep of both
# bands' 38 UK channels takes about 5 s, well inside
# CONFIG_METER_SCAN_TIMEOUT_S. Needs zephyr/patches/zephyr/
# esp32-wifi-scan-params.patch, without which the driver ignores it.
CONFIG_METER_SCAN_DWELL_PASSIVE_MS=130

# The C5 hears both bands: keep the 5 GHz networks as well (the console
# reports them; the screens show 2.4 GHz only so far).
CONFIG_METER_BAND_5G=y

# Room for a scan's worth of log lines while the console catches up: with
# 5 GHz a scan's report is up to 44 lines, which overflow Zephyr's default
# 1 KB ("--- 5 messages dropped ---"). The same as the Pico's.
CONFIG_LOG_BUFFER_SIZE=4096

# The reset cause in each start's record ("HW watchdog", "brown-out",
# "CPU fault", ...), from the chip's own reset reason (hwinfo). The XIAO's
# reset button pulls the chip's enable pin, which it reports as a
# power-on, not as "reset button".
CONFIG_METER_RESET_CAUSE_HWINFO=y

# The hardware watchdog's 4 s (prj.conf) is within the C5's timer-group
# watchdog range (wdt0, enabled by the board).
