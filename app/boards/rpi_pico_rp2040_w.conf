# Raspberry Pi Pico W: what only this board needs, on top of prj.conf.
# Zephyr adds this file for the board by name, as it does the overlay
# beside it (rpi_pico_rp2040_w.overlay: the Display Pack 2.0 and the USB
# console). The board's defconfig enables the CYW43439 (AIROC) Wi-Fi chip.

# Regulatory domain: which channels the chip scans (1-13 in the UK and
# Europe, 1-11 in the US). scripts/build.sh sets it from WIFI_COUNTRY.
CONFIG_WHD_WIFI_COUNTRY="WHD_COUNTRY_UNITED_KINGDOM"

# The hardware watchdog's 4 s (prj.conf) is within the RP2040's 8.3 s
# limit.

# The console on the Pico's own USB port, as a CDC-ACM serial port (with
# the cdc_acm_console node in the overlay). On a Mac it appears as
# /dev/cu.usbmodem<N>; on Linux as /dev/ttyACM<N>. src/target/pico/
# usb_console.c turns flow control on while a host has the port open.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Raspberry Pi"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Pico W network meter"
# Raspberry Pi's vendor ID and the Pico SDK's USB serial product ID, as
# Pico firmware's USB serial ports use, instead of Zephyr's test IDs.
CONFIG_CDC_ACM_SERIAL_VID=0x2e8a
CONFIG_CDC_ACM_SERIAL_PID=0x000a

# Room for a scan's worth of log lines while the host catches up.
CONFIG_LOG_BUFFER_SIZE=4096
