#
# Pico W network meter. The board's defconfig enables the CYW43439 (AIROC)
# Wi-Fi chip; boards/rpi_pico_rp2040_w.overlay adds the Display Pack 2.0.

# Wi-Fi: scans only, so no IP traffic beyond what the stack insists on.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=n
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
# Scan results arrive as events carrying their data.
CONFIG_NET_MGMT_EVENT_INFO=y
# A crowded place reports dozens of networks in a burst: queue them.
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

# Regulatory domain: which channels the chip scans (1-13 in the UK and
# Europe, 1-11 in the US). scripts/build.sh sets it from WIFI_COUNTRY.
CONFIG_WHD_WIFI_COUNTRY="WHD_COUNTRY_UNITED_KINGDOM"

# Display Pack 2.0: ST7789V panel, buttons, RGB LED and backlight.
CONFIG_DISPLAY=y
CONFIG_INPUT=y
CONFIG_LED=y
# Only for its fonts (cfb_font_1016, ...): text is drawn by text_raster.c.
CONFIG_CHARACTER_FRAMEBUFFER=y

CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
