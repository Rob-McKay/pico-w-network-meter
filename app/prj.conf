# Network meter: what every board shares. Each board adds its own
# boards/<board>.conf and boards/<board>.overlay (the Pico W's: the
# CYW43439's country, the Display Pack 2.0 and the USB console).

# Wi-Fi: scans only, so no IP traffic beyond what the stack insists on.
CONFIG_NETWORKING=y
CONFIG_WIFI=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=n
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
# Scan results arrive as events carrying their data.
CONFIG_NET_MGMT_EVENT_INFO=y
# A crowded place reports dozens of networks in a burst: queue them.
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

# Display Pack 2.0: ST7789V panel, buttons, RGB LED and backlight.
CONFIG_DISPLAY=y
CONFIG_INPUT=y
CONFIG_LED=y
# The RGB LED is dimmed with PWM (pwm-leds).
CONFIG_PWM=y
# Only for its fonts (cfb_font_1016, ...): text is drawn by text_raster.c.
CONFIG_CHARACTER_FRAMEBUFFER=y

CONFIG_LOG=y
# Restart to recover a Wi-Fi driver that has stopped working (scan_task.c).
CONFIG_REBOOT=y

# The event log of starts, in flash (event_log.c).
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FCB=y
# The restart note's checksum (boot_record.c).
CONFIG_CRC=y

# Restart if a thread stops responding (watchdog.c). The hardware watchdog
# behind it waits 4 s, longer than a flash erase stops interrupts for (each
# board's .conf notes its own limit).
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_MIN_TIMEOUT=2000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=2000
CONFIG_MAIN_STACK_SIZE=4096
